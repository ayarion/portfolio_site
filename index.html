<body class="is-intro">
  <a class="skip-link" href="#menu">メニューから作品を見る</a>
  <header class="masthead">
    <button class="menu-toggle" id="menu-toggle" aria-label="メニューを開く" aria-expanded="false" aria-controls="menu"><span></span><span></span><span></span></button>
  </header>
  <main id="journey">
    <section class="world" id="world" aria-label="水色の一本道に沿って4つの家を巡る街">
      <canvas id="town" tabindex="0" aria-describedby="walk-instructions" aria-label="ハムスターの街。行きたい場所をタップまたはクリックすると歩きます。縦スクロールでも進めます。"></canvas>
      <div id="destination-marker" aria-hidden="true" hidden></div>
      <div class="approach-prompt" id="approach-prompt" aria-hidden="true" inert>
        <button id="enter-house"><span id="enter-label">家に入る</span><span aria-hidden="true">↗</span></button>
        <small>クリック / Enter / スペース</small>
      </div>
      <p id="world-error" class="world-error" role="status" hidden></p>
    </section>
    <div class="journey-space" aria-hidden="true"></div>
  </main>
  <aside class="walk-controls" aria-label="街の操作">
    <div class="journey-progress"><span id="current-stop">道のはじまり</span><span id="progress-text">0%</span><div class="progress-track" aria-hidden="true"><span id="progress-fill"></span></div></div>
    <p class="walk-instructions" id="walk-instructions">行きたい場所をタップ。<small>縦スクロールでも歩けます</small></p>
  </aside>
  <dialog class="town-nav" id="menu" aria-labelledby="menu-title"><div class="menu-heading"><h2 id="menu-title">Portfolio</h2><button id="close-menu" class="close" aria-label="メニューを閉じる">×</button></div><nav aria-label="ポートフォリオの各ページを直接開く">
    <button data-house="about"><span>01</span> 自己紹介</button>
    <button data-house="projects"><span>02</span> 個人制作作品</button>
    <button data-house="team"><span>03</span> チーム制作作品</button>
    <button data-house="contact"><span>04</span> スキル / お問い合わせ</button>
  </nav><div class="menu-extras"><button class="reset" id="reset">↺ はじめに戻る</button><button id="help" class="help" aria-label="操作方法を開く">?</button></div></dialog>
  <div class="intro-layer" id="intro" role="button" tabindex="0" aria-disabled="true" aria-label="ハムスターの回し車。4秒後、クリックまたはEnterで街へ進む">
    <div id="wheel-slot" class="wheel-slot"></div>
  </div>
  <div class="wheel-host" id="wheel-host" aria-hidden="true"><canvas id="wheel" aria-label="紙の回し車を走るハムスター"></canvas></div>
  <div class="whiteout" id="whiteout" aria-hidden="true"></div>
  <dialog id="panel" aria-labelledby="panel-title"><div class="panel-top"><span id="panel-kicker" class="eyebrow"></span><button class="close" id="close-panel" aria-label="閉じて家の前に戻る">×</button></div><div id="panel-body"></div></dialog>
  <dialog id="outbound" aria-labelledby="outbound-title"><p class="eyebrow">ON MY WAY</p><h2 id="outbound-title">作品を開いています</h2><div id="outbound-wheel-slot"></div><p id="outbound-status" role="status">ハムスターも一緒に、次のページへ。</p></dialog>
  <p class="sr-only" id="announcement" aria-live="polite"></p>
  <noscript><p class="noscript">街を歩くにはJavaScriptを有効にしてください。<a href="https://github.com/ayarion">GitHub</a> / <a href="https://tsukuriba.org/togame/">togame</a> / <a href="https://tsukuriba.org/OjiMate/">OjiMate</a> / <a href="https://tsukuriba.org/kinto-log/">Kinto-Log</a> / <a href="https://tsukuriba.org/mersampo/">mersampo</a></p></noscript>
</body>
</html>
